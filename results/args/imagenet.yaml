_note: 'Configuration of each run reported in the paper. Shared settings are under `common`;
  each entry under `experiments` lists only the fields that differ from it, so a run is `common |
  experiments[<experiment>]`. These are the settings needed to rerun a configuration, not a verbatim dump
  of the original argparse namespace: `gpu`, `output`, `experiment` and `resume` are omitted
  as environment-specific and `data_dir` is a placeholder. Architecture arguments that this
  dataset''s train.py does not read from the configuration are fixed in its model.py. Reported
  experiments: `add` is the ADD baseline, `xor` the XOR-only model and `xor_ov` the proposed XOR+OV
  setting. The membrane shortcut is not available at this scale: imagenet/model.py implements
  add, xor, or and or_clamp only.'
common:
  aa: rand-m9-mstd0.5-inc1
  accum_steps: 1
  amp: true
  apex_amp: false
  aug_splits: 0
  batch_size: 48
  bn_eps: null
  bn_momentum: null
  bn_tf: false
  channels_last: false
  checkpoint_hist: 10
  clip_grad: null
  clip_mode: norm
  color_jitter: 0.4
  compile_mode: reduce-overhead
  cooldown_epochs: 10
  crop_pct: 1.0
  cutmix: 1.0
  cutmix_minmax: null
  data_dir: <data_root>/imagenet
  dataset: imagenet
  decay_epochs: 30
  decay_rate: 0.1
  dist_bn: ''
  drop: 0.0
  drop_block: null
  drop_connect: null
  drop_path: 0.2
  epoch_repeats: 0.0
  epochs: 300
  eval_metric: top1
  gp: null
  hflip: 0.5
  img_size: 224
  initial_checkpoint: ''
  input_size: null
  interpolation: bicubic
  jsd: false
  local_rank: 0
  log_interval: 1000
  log_wandb: false
  lr: 0.0005
  lr_cycle_limit: 1
  lr_cycle_mul: 1.0
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  mean:
  - 0.485
  - 0.456
  - 0.406
  min_lr: 1.0e-05
  mixup: 0.8
  mixup_mode: batch
  mixup_off_epoch: 0
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  model: spikformer
  model_ema: false
  model_ema_decay: 0.9998
  model_ema_force_cpu: false
  momentum: 0.9
  native_amp: false
  no_aug: false
  no_prefetcher: false
  no_resume_opt: false
  num_classes: 1000
  opt: adamw
  opt_betas: null
  opt_eps: null
  patience_epochs: 10
  pin_mem: false
  pretrained: false
  ratio:
  - 0.75
  - 1.3333333333333333
  recount: 1
  recovery_interval: 0
  remode: const
  reprob: 0.25
  resplit: false
  save_images: false
  scale:
  - 1.0
  - 1.0
  sched: cosine
  seed: 42
  smoothing: 0.1
  split_bn: false
  start_epoch: null
  std:
  - 0.229
  - 0.224
  - 0.225
  sync_bn: false
  torch_compile: false
  torchscript: false
  train_interpolation: bicubic
  train_split: train
  tta: 0
  use_multi_epochs_loader: false
  val_batch_size: 48
  val_split: val
  vflip: 0.0
  warmup_epochs: 20
  warmup_lr: 1.0e-06
  weight_decay: 0.05
  workers: 8
experiments:
  add:
    fusion: add
    lam_ov: 0.0
    ov_warmup_epochs: 0
  xor:
    fusion: xor
    lam_ov: 0.0
    ov_warmup_epochs: 0
  xor_ov:
    fusion: xor
    lam_ov: 10.0
    ov_warmup_epochs: 20
