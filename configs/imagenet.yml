# imagenet: settings shared by every experiment.
# The residual operator and the OV weight are command-line arguments
# (--fusion, --lam-ov, --ov-warmup-epochs); see results/args/imagenet.yaml
# for the per-experiment values actually used.

aa: rand-m9-mstd0.5-inc1
amp: true
batch_size: 48
color_jitter: 0.4
cooldown_epochs: 10
crop_pct: 1.0
cutmix: 1.0
data_dir: <data_root>
dataset: imagenet
decay_epochs: 30
decay_rate: 0.1
drop: 0.0
epochs: 300
eval_metric: top1
hflip: 0.5
img_size: 224
interpolation: bicubic
lr: 0.0005
mean:
- 0.485
- 0.456
- 0.406
min_lr: 1.0e-05
mixup: 0.8
mixup_mode: batch
mixup_off_epoch: 0
mixup_prob: 1.0
mixup_switch_prob: 0.5
model: spikformer
momentum: 0.9
num_classes: 1000
opt: adamw
ratio:
- 0.75
- 1.3333333333333333
recount: 1
remode: const
reprob: 0.25
scale:
- 1.0
- 1.0
sched: cosine
seed: 42
smoothing: 0.1
std:
- 0.229
- 0.224
- 0.225
train_interpolation: bicubic
train_split: train
val_batch_size: 48
val_split: val
vflip: 0.0
warmup_epochs: 20
warmup_lr: 1.0e-06
weight_decay: 0.05
workers: 8
