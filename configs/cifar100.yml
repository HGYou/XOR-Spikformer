# cifar100: settings shared by every experiment.
# The residual operator and the OV weight are command-line arguments
# (--fusion, --lam-ov, --ov-warmup-epochs); see results/args/cifar100.yaml
# for the per-experiment values actually used.

aa: rand-m9-n1-mstd0.4-inc1
amp: true
batch_size: 64
color_jitter: 0.0
cooldown_epochs: 20
crop_pct: 1.0
cutmix: 0.0
data_dir: <data_root>
dataset: torch/cifar100
decay_epochs: 30
decay_rate: 0.1
dim: 384
drop: 0.0
epochs: 300
eval_metric: top1
hflip: 0.5
img_size: 32
interpolation: bicubic
layer: 4
lr: 0.0005
mean:
- 0.5071
- 0.4867
- 0.4408
min_lr: 1.0e-05
mixup: 1.0
mixup_mode: batch
mixup_off_epoch: 200
mixup_prob: 1.0
mixup_switch_prob: 0.5
mlp_ratio: 4
model: spikformer
momentum: 0.9
num_classes: 100
num_heads: 12
opt: adamw
patch_size: 4
ratio:
- 1.0
- 1.0
recount: 1
remode: const
reprob: 0.25
scale:
- 1.0
- 1.0
sched: cosine
seed: 42
smoothing: 0.1
std:
- 0.2675
- 0.2565
- 0.2761
time_step: 4
train_interpolation: bicubic
train_split: train
val_batch_size: 64
val_split: validation
vflip: 0.0
warmup_epochs: 20
warmup_lr: 1.0e-05
weight_decay: 0.06
workers: 8
